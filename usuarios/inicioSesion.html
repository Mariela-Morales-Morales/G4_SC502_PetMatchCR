<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión | PetMatch CR</title>
    <link rel="stylesheet" href="../css/usuariosMascotas.css">
    <script src="../js/usuarios.js" defer></script>
</head>

<body>
    <header class="encabezado">
        <nav class="navegacion">
            <a href="../index.html" class="logo"><img src="../img/logos/04_Logo_Blanco_Para_Fondo_Verde.png"
                    alt="PetMatch CR"></a>
            <ul class="menu">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../catalogo.html">Mascotas</a></li>
                <li><a href="../mascota/publicaciones.html">Mis publicaciones</a></li>
                <li><a href="../usuarios/perfil.html">Mi perfil</a></li>
            </ul>
            <a href="inicioSesion.html" class="boton-ingresar">Ingresar</a>
        </nav>
    </header>
    <main>
        <section class="contenedor-usuario">
            <div class="encabezado-pagina">
                <span class="etiqueta-catalogo">Qué alegría tenerte aquí</span>
                <h1>Iniciar sesión ♡</h1>
                <p>Ingresa a tu cuenta para administrar tu perfil y tus publicaciones.</p>
            </div>
            <section class="tarjeta-formulario">
                <form id="formLogin" class="formulario">
                    <div class="campo completo"><label for="correoLogin">Correo electrónico</label><input
                            id="correoLogin" type="email" placeholder="correo@ejemplo.com" required></div>
                    <div class="campo completo"><label for="claveLogin">Contraseña</label><input id="claveLogin"
                            type="password" placeholder="Escribe tu contraseña" required></div>
                    <div class="acciones-formulario"><button class="boton-verde" type="submit">Ingresar</button><a
                            class="boton-borde" href="registroUsuarios.html">Crear una cuenta</a></div>
                </form>
                <p id="mensajeLogin" class="mensaje" role="status"></p>
            </section>
        </section>
    </main>
    <footer class="pie-pagina">
        <p>PetMatch CR — Plataforma de adopción responsable</p>
        <p>Un hogar cambia una vida. ♡</p>
    </footer>
</body>

</html>
